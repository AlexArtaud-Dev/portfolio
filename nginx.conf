server {
    listen 7000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /_next/static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /404.html;
}
