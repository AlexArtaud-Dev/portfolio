server {
    listen 7000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /_next/static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Next.js generates this file without an extension; force the correct
    # Content-Type so link previews (Discord, Slack, Twitter...) render it.
    location = /opengraph-image {
        default_type image/png;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    error_page 404 /404.html;
}
